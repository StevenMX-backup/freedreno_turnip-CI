name: Build Turnip Dual

on:
  workflow_dispatch: # Botão para iniciar manualmente
  schedule:
    - cron: '0 */12 * * *' # Executa automaticamente a cada 12 horas

# Permissões necessárias para criar Releases e fazer upload de ficheiros
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools
          pip3 install --upgrade meson mako

      - name: Tornar o Script Executável
        run: chmod +x turnip_builder.sh

      - name: Compilar Drivers (Standard + A6xx)
        run: ./turnip_builder.sh

      - name: Ler Metadados da Release
        id: meta
        run: |
          # Lê as informações geradas pelo script para usar na criação da Release
          echo "TAG_NAME=$(cat turnip_workdir/tag)" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(cat turnip_workdir/release)" >> $GITHUB_ENV

      # Faz o upload de TODOS os zips gerados para a aba "Actions" (Backup)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Drivers-Dual
          path: turnip_workdir/*.zip
          if-no-files-found: error

      # Cria a Release oficial e anexa os dois drivers
      - name: Publicar Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body_path: turnip_workdir/description
          files: turnip_workdir/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
